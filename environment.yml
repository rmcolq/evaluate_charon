# One environment for the pipeline and the analysis scripts:
#   conda env create -f environment.yml && conda activate evaluate_charon
# With -profile conda every process uses it. Charon is not on bioconda, so its processes need a container.
name: evaluate_charon
channels:
  - conda-forge
  - bioconda
dependencies:
  - openjdk>=17
  - nextflow>=25.10
  # the tools the processes run, at the versions of their containers
  - samtools=1.21
  - minimap2=2.28
  - blast=2.16.0
  - deacon=0.20.0
  - nohuman=0.5.1
  # scripts/shuffle_reads.sh
  - seqkit
  # bin/ (in the pipeline) and scripts/ (analysis)
  - python>=3.10,<3.13
  - numpy
  - pandas
  - scipy
  - matplotlib-base
  - python-duckdb
  - pyarrow
  - pip
  - pip:
      - simplesam
      - taxoniq
